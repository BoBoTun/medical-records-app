services:
  db:
    image: postgres:16
    container_name: medrec-db
    environment:
      POSTGRES_USER: medrec
      POSTGRES_PASSWORD: medrec
      POSTGRES_DB: medrec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrec"]
      interval: 3s
      retries: 10
volumes:
  pgdata:
